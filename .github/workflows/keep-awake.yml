name: MySQL to OSS Sync

on:
  schedule:
    # 每5分钟运行一次（工作日），直接同步 MySQL → OSS
    # 不依赖 Render.com，GitHub Actions 有自己的网络
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymysql oss2

      - name: Sync MySQL to OSS
        run: python sync_job.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_ACCESS_SECRET: ${{ secrets.OSS_ACCESS_SECRET }}
