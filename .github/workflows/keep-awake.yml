name: Keep Render Awake + Sync

on:
  schedule:
    # 每5分钟运行一次（工作日），唤醒Render并触发一次同步
    # Render免费版15分钟空闲会休眠，此心跳确保交易日不会睡
    - cron: '*/5 * * * 1-5'
  # 允许手动触发（测试用）
  workflow_dispatch:

jobs:
  ping-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and trigger sync
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" https://trade-api-n4p8.onrender.com/oss/sync)
          echo "HTTP $STATUS"
          cat /tmp/resp.json
